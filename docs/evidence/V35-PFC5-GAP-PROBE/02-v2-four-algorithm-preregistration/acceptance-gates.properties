# GAP-PROBE-V2 acceptance gates (frozen 2026-08-30)
# 20k mechanism shakedown (remote, 4 runs, 50_2_3_1 x 20260827, same snapshot)
shakedown20k.instance=50_2_3_1
shakedown20k.seed=20260827
shakedown20k.population=100
shakedown20k.maxFEs=20000
shakedown20k.algorithms=A4;A0(HMOPSO-QGS-F);SPEA2-F;NSGA-II-F
gate.A4.positive=formalOuterCycles>0; formalQgRounds>0; qgSelections>0; pddrEvents>0; cfvfOffspring>0; qpActions>0; dualQ phase counts>0; caTaLiteTest>0 or caTaLiteApply>0
gate.A4.zero=illegalSolutions=0; duplicateEvaluations=0; cfvfRepairs=0; shiftActivity=0; directionalTeacherPool=0; REGION_AWARE=0; BP_RESERVED=0; shadowEvaluations=0
gate.A0.positive=formalOuterCycles>0; formalQgRounds>0; qgSelections>0; pddrEvents>0; baselineUpdateEvents>0 (or fixed O1-O9 path trigger)
gate.A0.zero=qpActions=0; dualQ=0; cfvfOffspring=0; caTaLiteTest=0; caTaLiteApply=0; directionalTeacherPool=0; shiftActivity=0
gate.SPEA2F.positive=strength/rawFitness; archive; environmentalSelection; tournament>0; crossover>0; mutation>0
gate.NSGA2F.positive=binaryTournament; nondominatedRanking; crowdingDistance; rankingAndCrowdingReplacement; crossover>0; mutation>0
gate.externals.zero=no V35 mechanism tokens in identityEvidence; forbiddenMechanismEvents=0
gate.common=front nonempty+finite; actualFE=decoderCalls=fullEvaluations; 0<actualFE<=MaxFEs; remainingFE<5000; fairness-group actualFE span<5000; identical snapshot+V35/P8 initial hashes across arms; sourceLoss=0; independent JVM; atomic output; per-run manifest reverse-matched
shakedown.failureVerdict=V2_SHAKEDOWN_FAILED (keep evidence, stop, no 500k)
# 500k acceptance (16 runs)
gate500k.perRun=status=COMPLETED; front nonempty+finite; actualFE=decoderCalls=fullEvaluations; 0<actualFE<=500000; remainingFE<5000; illegalSolutions=0; duplicateEvaluations=0; unexplainedRepairs=0; forbiddenMechanismEvents=0; snapshot/config/Jar/provenance match
gate500k.termination=A0/A4: EXACT_MAX_FE or PHASE_CONSISTENT_TAIL_STOP both legal; externals usually exact close; unified MaxFEs upper bound
gate500k.mechanismIdentity=each arm's mechanism identity gates close (A4 positive set incl. caTaLite; A0 baseline updates; SPEA2/NSGA2 official machinery counters)
gate500k.fairnessGroup=same instance/seed/snapshot/initialPopulationHashV35/initialPopulationHashP8/problem provenance; four unique arms complete; max(actualFE)-min(actualFE)<5000; missing arm or INVALID => excluded from reference
gate500k.retry=keep original attempt; new attempt number; rerun failed runs only; never overwrite completed dirs; link via sourceRunId
# reference + verdict (see GAP_PROBE_V2_REFERENCE_CONTRACT.md)
reference.perInstance=8 accepted raw fronts -> exact dedup -> strict ND -> PFref -> ideal/nadir -> normalize -> HV(1.1,1.1,1.1) -> recompute HV/IGD/Cmax/TEC/TWC; order-independence mandatory
verdict.bands=GAP_WITHIN_5 | GAP_5_TO_15 | GAP_GT_15 (per instance x competitor on max(median gapHV, median gapIGD))
verdict.RED=only if same competitor and same primary metric shows A4 lag >15% on BOTH instances and BOTH seeds; else NOT_RED; GREEN forbidden
verdict.blocked=missing/invalid run => BLOCKED_REFERENCE_OR_RUNS
external.selection=mean rank of HV and IGD across 2 instances x 2 seeds over four arms; tie-break HV mean rank, then IGD mean rank, then label order
# state invariants
gapProbeStarted=false
gapProbe500kCompleted=false
validationStarted=false
FinalCandidateApproved=false
FINAL_FROZEN=false
formalMatrixRunning=false
algorithmChanged=false
PDDRChanged=false
CFVFChanged=false
DualQChanged=false
CaTaChanged=false
