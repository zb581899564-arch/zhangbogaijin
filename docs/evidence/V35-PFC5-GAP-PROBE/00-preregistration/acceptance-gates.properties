# GAP-PROBE acceptance gates (frozen 2026-08-30)
# Phase 1: 2k shakedown gates (all must pass for GAP_PREREGISTERED_NOT_STARTED + shakedown OK)
shakedown.instance=50_2_3_1
shakedown.seed=20260827
shakedown.population=100
shakedown.maxFEs=2000
shakedown.algorithms=A4;A0(HMOPSO-QGS-F);SPEA2-F
gate1_sameInitialPopulation=three arms read the byte-identical snapshot 68c44eae...; V35 hash a73e922f... and P8 hash 219db415... must be identical across all three run records
gate2_feClosed=A4/A0: 0 < actualFE=decoderCalls=fullEvaluations <= 2000 with phase-consistent remaining < 5000 (2k < qPhase 5000 is expected to stop early at an atomic boundary); SPEA2-F: actualFE=decoderCalls=fullEvaluations=2000 exactly
gate3_frontNonEmptyFinite=true
gate4_illegalDuplicateRepairsZero=true
gate5_forbiddenMechanisms=A0: qpActions=0,cfvfOffspring=0,caTaLiteTest=0,dualQ=0; A4: its own frozen mechanisms active and nothing beyond (region-aware/BP_RESERVED/shift absent; runner gate enforces shiftActivity=0, cfvfRepairs=0, directionalPool=0, shadow=0); SPEA2-F: identityEvidence contains no V35 mechanism tokens; external runner forbiddenMechanismEvents=0
gate6_identityEvents=A4: qgSelections>0,pddrEvents>0 (once a full Q phase fits, else wiring-only per runner gate); A0: qgSelections>0,pddrEvents>0; SPEA2-F: crossover/mutation/tournament counters > 0
gate7_outputArtifacts=configuration/source-provenance/initial-population.sha256/status/front/event-summary/budget-termination present per run with per-run manifest
shakedownVerdictValues=SHAKEDOWN_PASSED|SHAKEDOWN_FAILED
# Phase 2 gates (500k; separate user authorization required)
gate500k.acceptance=per-run: status=COMPLETED; actualFE=decoderCalls=fullEvaluations=500000; remainingFE<5000; illegal/duplicate/unexplainedRepairs=0; front finite/nonempty; initial population hash equals registry binding; forbidden mechanisms per gate5
gate500k.reference=per-instance empirical PFref from the 6 accepted raw fronts only (see GAP_PROBE_REFERENCE_CONTRACT.md); order-independence check required; HV ref point (1.1,1.1,1.1); HV/IGD/extremes recomputed uniformly
gate500k.verdict=three-band per (instance, competitor) via max(median gapHV, median gapIGD); RED only if one primary metric >15% for both instances and both seeds; otherwise NOT_RED; GREEN forbidden; missing/invalid run => BLOCKED_REFERENCE_OR_RUNS
# state invariants
gapProbeStarted=false
gapProbe500kStarted=false
validationStarted=false
FinalCandidateApproved=false
formalMatrixRunning=false
algorithmChanged=false
PDDRChanged=false
CFVFChanged=false
