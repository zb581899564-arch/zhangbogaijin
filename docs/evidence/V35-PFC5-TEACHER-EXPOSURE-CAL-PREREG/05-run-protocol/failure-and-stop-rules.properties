status=PREREGISTERED_NOT_STARTED
algorithmChanged=false
formalMatrixRunning=false
consumedFE=0

# ---- robustness gate (per 100-job instance) --------------------------------
robustnessBaseline=C0_CURRENT
deltaHVDefinition=(HV_config - HV_C0) / HV_C0
deltaIGDDefinition=(IGD_C0 - IGD_config) / IGD_C0
positiveMeans=improvement
seedAggregation=median over the two paired seeds
robustnessEjectThresholdHV=-0.10
robustnessEjectThresholdIGD=-0.20
robustnessEjectRule=median(deltaHV) < -0.10 OR median(deltaIGD) < -0.20
robustnessAppliesTo=the two 100-job development instances only
robustnessPrinciple=do no harm first, then talk about average performance
crossScaleOffsetForbidden=true

# ---- rank race --------------------------------------------------------------
rankRaceInput=configurations surviving the robustness gate
rankAggregation=aggregate the two seeds within each instance first
rankMetrics=HV rank; IGD rank
scoreFormula=(MeanRank_HV + MeanRank_IGD) / 2
scoreDirection=smaller is better
weightedTotalScoreForbidden=true
tieBreakOrder=median deltaHV;median deltaIGD;median deltaCmax;median deltaTEC;median deltaTWC;smaller lambda;configuration label

# ---- empty-set rules --------------------------------------------------------
ruleFourSurvive=take Top2
ruleThreeSurvive=take Top2
ruleTwoSurvive=both enter 500k
ruleOneSurvive=that configuration plus C0 enter 500k
ruleZeroSurvive=repair family FAIL
c0OnlySurvivorVerdict=TEACHER_EXPOSURE_CALIBRATION=NO_IMPROVING_CONFIGURATION
newConfigsForbidden=true
gateRelaxationForbidden=true
lambdaGridChangeForbidden=true

# ---- stop rules -------------------------------------------------------------
stopOnImplementationGateFailure=CAL_IMPLEMENTATION_GATE=FAILED -> no Race
stopOnMechanismNotActivated=MECHANISM_NOT_ACTIVATED -> stop and report, no Race
stopOnBudgetViolation=any run violates the budget protocol -> that run is a failed attempt, never overwritten
stopOnSnapshotMismatch=initial population hash mismatch -> abort the whole Race
stopBeforeTop2=Top2 requires separate user approval; not authorized by this preregistration

# ---- future Top2 contract (not started) -------------------------------------
futureTop2Configs=Top2
futureTop2Instances=normal100 DEVELOPMENT; hard100 DEVELOPMENT
futureTop2Seeds=the same two paired seeds per instance
futureTop2MaxFEs=500000
futureTop2Reference=rebuild PFref per instance from the Top2 runs only
futureTop2Output=single V35-R
futureTop2Close=INTERNAL_DEVELOPMENT_CLOSED=true
futureTop2RequiresSeparateUserApproval=true
futureTop2Status=NOT_STARTED
