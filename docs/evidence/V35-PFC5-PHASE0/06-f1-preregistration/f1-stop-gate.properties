# F1 stop gate (preregistered; four outcomes only)
f1Statuses=FAILURE_CLASS_REPRODUCED|FAILURE_CLASS_NOT_REPRODUCED|RUN_INVALID|REFERENCE_INVALID
# branch: reproduced
on_FAILURE_CLASS_REPRODUCED=allow separate F2 preregistration (user approval still required); F3 only if F2 behavioral equivalence passes AND historical A2 checkpoint fronts unavailable
# branch: not reproduced
on_FAILURE_CLASS_NOT_REPRODUCED=set FC5_HISTORICAL_CASE=CLOSED; forbid F2 and F3; proceed to prospective current-semantics stability or HYPOTHESIS_DRIVEN_DEVELOPMENT_CALIBRATION (teacher exposure, lambda single knob)
# branch: run invalid
on_RUN_INVALID=repair run chain only; no algorithm interpretation; rerun requires same preregistration binding
# branch: reference invalid
on_REFERENCE_INVALID=return to reference contract repair; no algorithm interpretation; F1 not runnable until contract re-frozen
# hard stops
f2WithoutReproducedForbidden=true
f3WithoutF2EquivalenceForbidden=true
t*DefinitionForbiddenUntilF2Equivalence=true
repairFamilySelectionBeforeTstarForbidden=true
# post-run immutability
failureGateMutableAfterRun=false
seedMutableAfterRun=false
referenceMutableAfterRun=false
# execution status (must remain false in Phase 0)
f1Started=false
f2Started=false
f3Started=false
formalMatrixRunning=false
